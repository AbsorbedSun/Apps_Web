<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login al Sistema</title>
    <meta name="author" content="AGA, RGR, RMJ, RMM" />
    <link rel="stylesheet" href="CSS/estilos_equipo5.css" />
  </head>
  <body>
    <div class="Principal">
      <header>
        <div class="logo-equipo">
          <img src="Images/logoEquipo.png" alt="Logo del Equipo 5" />
        </div>
        <div class="logo-ipn">
          <img src="Images/Logo_IPN2.jpg" alt="Logo del IPN" />
        </div>
      </header>
      <main>
        <h1>Acceso al Sistema:</h1>
        <form action="bienvenida.html">
          <div class="acceso">
            <img src="Images/usuario.png" alt="icono_usu" />
            <input type="text" name="usuario" />
            <img src="Images/candado.png" alt="Candado_usu" />
            <input type="password" name="password" />
          </div>
          <br />
          <button type="submit" class="btn-ingresar">Ingresar</button>
        </form>
      </main>
    </div>
    <footer>
      <div class="footerIzq">
        <a href="https://www.escom.ipn.mx" target="_blank">
          <img src="Images/logoEscom.png" alt="Logo ESCOM" />
        </a>
      </div>
      <div class="footerDer">
        <p>&copy; 2026, Grupo: 4CM4, Equipo: 5</p>
      </div>
    </footer>
  </body>
</html>
