<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="author" content="AGA" />
    <title>Ejemplo de tablas</title>
  </head>
  <body>
    <table style="border: 1px solid dimgrey">
      <tr>
        <th colspan="2" style="border: 1px solid dimgrey">Venta</th>
      </tr>
      <tr>
        <th style="border: 1px solid dimgrey">Producto</th>
        <th style="border: 1px solid dimgrey">Precio</th>
      </tr>
      <tr>
        <td>Refresco</td>
        <td>$20</td>
      </tr>
      <tr>
        <td>Papas</td>
        <td>$25</td>
      </tr>
      <tr>
        <td colspan="2">Total $45</td>
      </tr>
    </table>
    <br />

    <h3 style="text-align: center">Ejemplo de Tabla 1</h3>
    <table style="border: 1px solid dimgrey; margin: auto">
      <tr>
        <th style="background-color: cadetblue" rowspan="2">Semestre 2027/1</th>
        <th style="background-color: coral" colspan="2">Alumnos</th>
      </tr>
      <tr>
        <th style="background-color: aquamarine">Hombre</th>
        <th style="background-color: aquamarine">Mujer</th>
      </tr>
      <tr>
        <td>Acreditados</td>
        <td>1</td>
        <td>26</td>
      </tr>
      <tr>
        <td>No Acreditados</td>
        <td>2</td>
        <td>7</td>
      </tr>
      <tr>
        <td>Total</td>
        <td>3</td>
        <td>33</td>
      </tr>
    </table>
  </body>
</html>
