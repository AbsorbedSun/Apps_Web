<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Ejemplo de CSS</title>
    <style>
      ol {
        color: yellowgreen;
        font-size: 20px;
      }

      h2,
      h3 {
        text-align: center;
        text-decoration: underline;
      }
    </style>
    <link rel="stylesheet" href="Forms/CSS/list.css" />
  </head>
  <body>
    <header>
      <h2>Ejemplos de Estilos con CSS</h2>
    </header>
    <main>
      <h3>Definicion de Estilos según categoría</h3>
      <section>
        <p>¿Cual es tu color favorito?</p>
        <ol style="color: green" type="A">
          <li id="rojo">Rojo</li>
          <li>Violeta</li>
          <li>Azul</li>
        </ol>

        <p>¿Cual es tu mascota favorita?</p>
        <ol type="I">
          <li>Perro</li>
          <li>Gato</li>
          <li>Huron</li>
        </ol>
        <p class="centrar violeta">
          El próximo lunes debes venir vestido de tu color favorito
        </p>
        <p>Ejemplo de selector de descendencia</p>
      </section>
    </main>
  </body>
</html>
